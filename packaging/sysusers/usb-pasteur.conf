# User of the sandboxed scan workers (scan.sandbox_user): no home, no shell
u usb-pasteur-scan - "USB-Pasteur scan workers" / /usr/sbin/nologin
# User of the online signature updates (usb-pasteur-update.service): the only
# one the firewall of an online kiosk lets out
u usb-pasteur-update - "USB-Pasteur online updates" / /usr/sbin/nologin
