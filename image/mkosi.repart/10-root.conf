# Read-only root filesystem: the whole system but /var, as small as possible,
# protected by dm-verity. Its root hash is in the kernel command line of the
# signed unified kernel image (UKI): a modified block cannot be read.
[Partition]
Type=root
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/var/
Minimize=best
Verity=data
VerityMatchKey=root
