# Test profile, for the virtual machine tests only (image/vm/): test-only
# signatures that detect the corpus of image/vm/corpus.py, and a root shell
# without password on the virtio console (hvc0). Never deploy it on a kiosk.

[Output]
Output=usb-pasteur-test

[Content]
# The production image has no login program: no interactive session at all
Packages=login
Autologin=yes
KernelCommandLine=console=ttyS0
ExtraTrees=%D/mkosi.profiles/test/mkosi.extra
PostInstallationScripts=%D/mkosi.profiles/test/postinst.chroot
