# systemd-boot of the kiosk (on the ESP: not changed by image updates)
# The default entry, the newest version that is not marked bad, starts at
# once: no menu, and the keys are not read. A keyboard plugged in at boot
# cannot select another version, power off the machine or reboot into the
# firmware setup.
timeout menu-disabled
editor no
auto-entries no
auto-firmware no
auto-poweroff no
auto-reboot no
# Without a menu, the certificate of the image (loader/keys/auto/) is
# enrolled automatically when the firmware is in Secure Boot setup mode
# (keys cleared in the firmware setup, behind its password)
secure-boot-enroll force
