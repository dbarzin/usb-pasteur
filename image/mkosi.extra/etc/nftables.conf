#!/usr/sbin/nft -f
# Firewall of the kiosk: nothing goes in or out, except on the loopback
# interface. Signature updates will open a dedicated channel (phase 2).
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy drop;
        oif lo accept
    }
}
