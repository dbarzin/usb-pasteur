# USB-Pasteur kiosk image (phase 2). Build it with image/build.sh, which runs
# mkosi in a Debian 13 container: see docs/image.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=usb-pasteur
Output=usb-pasteur
CompressOutput=no
ManifestFormat=json
SplitArtifacts=uki

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# No USB device is authorized until USBGuard has applied its policy
KernelCommandLine=ro usbcore.authorized_default=0
Hostname=usb-pasteur
Locale=C.UTF-8
Timezone=Etc/UTC
WithDocs=no
CleanPackageMetadata=yes

# No driver for USB network adapters, wireless, Bluetooth, USB serial adapters
# and modems: such devices are not even usable when plugged in. Staging
# drivers and batman-adv are excluded too: they would bring the wireless
# modules back as dependencies. USB HID is kept for the touchscreen;
# keyboards and mice are blocked by USBGuard.
KernelModulesExclude=
    drivers/net/usb/
    drivers/net/wireless/
    net/wireless/
    net/mac80211/
    drivers/bluetooth/
    net/bluetooth/
    drivers/usb/serial/
    drivers/usb/class/cdc-acm
    drivers/staging/
    net/batman-adv/
KernelModulesInitrdExclude=
    drivers/net/usb/
    drivers/net/wireless/
    net/wireless/
    net/mac80211/
    drivers/bluetooth/
    net/bluetooth/
    drivers/usb/serial/
    drivers/usb/class/cdc-acm
    drivers/staging/
    net/batman-adv/

# The repository (one level up) is mounted at /work/src/usb-pasteur
BuildSources=..:usb-pasteur

Packages=
    linux-image-amd64
    systemd
    systemd-sysv
    systemd-boot-efi
    systemd-repart
    udev
    kmod
    util-linux
    mount
    e2fsprogs
    eject
    python3
    python3-venv
    libmagic1
    clamav-daemon
    usbguard

# Build of the usb-pasteur wheel (mkosi.build.chroot), without network
BuildPackages=
    python3-pip
    python3-hatchling

[Validation]
# Sign systemd-boot, the UKI and the root hash. Development keys are generated
# by build.sh; release keys stay out of the repository (docs/image.md).
SecureBoot=yes
SecureBootKey=%D/mkosi.key
SecureBootCertificate=%D/mkosi.crt
Verity=yes
VerityKey=%D/mkosi.key
VerityCertificate=%D/mkosi.crt

[Build]
# Reuse the installed packages between builds (cache in a Docker volume)
Incremental=yes
