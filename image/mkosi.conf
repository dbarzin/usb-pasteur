# USB-Pasteur kiosk image (phase 2). Build it with image/build.sh, which runs
# mkosi in a Debian 13 container: see docs/image.md.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=usb-pasteur
Output=usb-pasteur
CompressOutput=no
ManifestFormat=json
SplitArtifacts=uki

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=ro
Hostname=usb-pasteur
Locale=C.UTF-8
Timezone=Etc/UTC
WithDocs=no
CleanPackageMetadata=yes

# The repository (one level up) is mounted at /work/src/usb-pasteur
BuildSources=..:usb-pasteur

Packages=
    linux-image-amd64
    systemd
    systemd-sysv
    systemd-boot-efi
    systemd-repart
    udev
    kmod
    util-linux
    mount
    e2fsprogs
    eject
    python3
    python3-venv
    libmagic1
    clamav-daemon

# Build of the usb-pasteur wheel (mkosi.build.chroot), without network
BuildPackages=
    python3-pip
    python3-hatchling

[Build]
# Reuse the installed packages between builds (cache in a Docker volume)
Incremental=yes
